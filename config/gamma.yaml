# gamma の偽ファームの定数。gamma_turret_fw の src/robot.hpp（制御定数）と **対で更新する**。
# 値の意味は設計書 docs/superpowers/specs/2026-10-24-gamma-sim-design.md 4.3
gamma_fake_node:
  ros__parameters:
    link_path: /tmp/gamma_fake   # robot_bridge の device に渡すシンボリックリンク
    tick_hz: 100
    # 脚リンクの寸法と車高の範囲（linkage.*）は rabbits_description の config/gamma_linkage.yaml を launch で一緒に渡す
    leg:
      azimuth: [-0.7854, 0.7854, -2.3562, 2.3562]   # [rad] LEG_AZIMUTH: FR, FL, BR, BL
      ramp_rate: 0.5             # [rad/s] LEG_RAMP_RATE
    wheel:
      wheel_d: 0.075             # [m] WHEEL_D（φ75）
      body_d: 0.328              # [m] BODY_D（車輪の接地点の配置径 = 2 × tilt_radius、中間の車高）
      sign: -1.0                 # WHEEL_SIGN
    chassis:
      vel_max: 1.0               # [m/s] CHASSIS_VEL_MAX
      rot_max: 3.0               # [rad/s] CHASSIS_ROT_MAX
      spin_speed: 5.0            # [rad/s] SPIN_SPEED（無限回転）
    watchdog_s: 0.5              # WATCHDOG_S
    follow_neck_pitch_roll: false  # true: 首 Pitch / Roll を JOINT_CMD に追従させる（確認用。ファームは送らない）
